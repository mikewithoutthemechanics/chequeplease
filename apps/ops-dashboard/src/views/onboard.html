<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Crew Onboarding — YachtCrew Pay</title>
<style>body{font-family:Arial,sans-serif;background:#f8fafc;margin:0;padding:24px;color:#0f172a}
.wrap{max-width:560px;margin:auto;background:#fff;padding:24px;border-radius:12px;box-shadow:0 1px 6px rgba(0,0,0,.08)}
.step{display:none}.step.on{display:block}input,select{width:100%;padding:10px;margin:6px 0;border:1px solid #cbd5e1;border-radius:6px;box-sizing:border-box}
button{padding:10px 16px;background:#2563eb;color:#fff;border:0;border-radius:6px;cursor:pointer;margin-top:8px}
button.sec{background:#e2e8f0;color:#0f172a}#e{color:#dc2626}.ok{color:#059669}</style></head>
<body><div class="wrap">
<h2>Crew onboarding</h2>
<div id="s0" class="step on">
<p>Paste the invite link or token from your manager.</p>
<input id="token" placeholder="Invite token (or full link)">
<div id="e0"></div>
<button onclick="check()">Continue</button>
</div>
<div id="s1" class="step">
<h3>Step 1 — Who are you?</h3>
<input id="fullName" placeholder="Full name (as on bank account)">
<input id="rank" placeholder="Rank (e.g. Deckhand, Engineer)">
<input id="nationality" placeholder="Nationality (e.g. PH)" maxlength="4">
<div id="e1"></div>
<button class="sec" onclick="show(0)">Back</button>
<button onclick="show(2)">Continue</button>
</div>
<div id="s2" class="step">
<h3>Step 2 — Where should pay land?</h3>
<input id="homeCurrency" placeholder="Home currency (e.g. PHP)" maxlength="3">
<input id="bankCountry" placeholder="Bank country (e.g. PH)" maxlength="3">
<input id="ibanOrAccount" placeholder="IBAN or account number">
<input id="dayRateMinor" inputmode="numeric" placeholder="Day rate in EUR cents (e.g. 12000 = €120)">
<div id="e2"></div>
<button class="sec" onclick="show(1)">Back</button>
<button onclick="submit()">Submit</button>
</div>
<div id="s3" class="step"><h3 class="ok">Done — you're on the payroll.</h3><p id="done"></p></div>
<script>
let INV=null;
function show(n){document.querySelectorAll('.step').forEach(s=>s.classList.remove('on'));document.getElementById('s'+n).classList.add('on');}
async function check(){
  let t=document.getElementById('token').value.trim();
  const m=t.match(/token=([a-f0-9]+)/i); if(m)t=m[1];
  const r=await fetch('/ops/api/invites/validate?token='+encodeURIComponent(t));
  const j=await r.json();
  if(!r.ok){document.getElementById('e0').textContent=j.error||'Invalid invite';return;}
  INV={...j,token:t}; show(1);
}
async function submit(){
  const up=v=>v.trim().toUpperCase();
  const body={token:INV.token, fullName:val('fullName'), rank:val('rank'), nationality:up(val('nationality'))||undefined,
    homeCurrency:up(val('homeCurrency')), bankCountry:up(val('bankCountry')), ibanOrAccount:val('ibanOrAccount'),
    dayRateMinor:Number(val('dayRateMinor')), phone:INV.contact||undefined};
  if(!body.fullName||!body.rank||!/^[A-Z]{3}$/.test(body.homeCurrency)){document.getElementById('e2').textContent='Check name, rank and 3-letter currency.';return;}
  const r=await fetch('/ops/api/invites/accept',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});
  const j=await r.json();
  if(!r.ok){document.getElementById('e2').textContent=j.error||'Failed';return;}
  document.getElementById('done').textContent='Welcome aboard, '+j.crew.fullName+' — '+j.crew.homeCurrency+' payouts ready.';
  show(3);
}
function val(id){return document.getElementById(id).value.trim();}
</script></div></body></html>
